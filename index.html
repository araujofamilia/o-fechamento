<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Fechamento · o jogo das teorias do jornalismo</title>
<meta name="description" content="Jogo de revisão de Teoria do Jornalismo (PUC-Campinas, 2026/2). Não vale nota: prepara para a prova.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f1e7; --papel2:#efe7d6; --tinta:#1d1b18; --cinza:#6b665d; --linha:#d8cfbd;
  --vermelho:#c0392b; --verde:#2e7d4f; --ouro:#c9922e;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --titulo:"Playfair Display",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--serif);font-size:18px;line-height:1.55;
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:4px 4px;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--vermelho)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 80px}
.sans{font-family:var(--sans)}
/* barra */
#barra{position:sticky;top:0;z-index:20;background:var(--tinta);color:#f6f1e7;font-family:var(--sans);font-size:14px}
#barra .in{max-width:1040px;margin:0 auto;padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#barra .marca{font-family:var(--titulo);font-weight:900;font-size:19px;letter-spacing:.5px;cursor:pointer}
#barra .esp{flex:1}
#barra .chip{background:rgba(255,255,255,.1);border-radius:999px;padding:3px 10px;white-space:nowrap}
#barra .xpbar{width:120px;height:7px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
#barra .xpbar i{display:block;height:100%;background:var(--ouro);transition:width .6s}
#barra button{background:none;border:1px solid rgba(255,255,255,.35);color:#f6f1e7;border-radius:6px;padding:3px 10px;cursor:pointer}
#barra button:hover{background:rgba(255,255,255,.12)}
/* cabeçalho de jornal */
.masthead{text-align:center;border-bottom:4px double var(--tinta);padding:26px 0 10px;margin-bottom:6px}
.masthead .kicker{font-family:var(--sans);text-transform:uppercase;letter-spacing:3px;font-size:12px;color:var(--cinza)}
.masthead h1{font-family:var(--titulo);font-weight:900;font-size:clamp(44px,9vw,96px);line-height:.95;margin:6px 0 4px;letter-spacing:-1px}
.masthead .sub{font-style:italic;font-size:20px}
.dateline{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--tinta);padding:6px 0;margin-bottom:24px;gap:10px;flex-wrap:wrap}
.manchete{font-family:var(--titulo);font-weight:900;font-size:clamp(30px,5vw,50px);line-height:1.05;margin:4px 0 12px}
.linhafina{font-size:21px;color:#3a362f;margin:0 0 20px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:0 30px;grid-template-areas:'intro entrada' 'resto entrada';align-items:start}
.c-intro{grid-area:intro}.c-resto{grid-area:resto}.c-entrada{grid-area:entrada;position:sticky;top:20px}
@media (max-width:820px){.cols{grid-template-columns:1fr;grid-template-areas:'intro' 'entrada' 'resto'}.c-entrada{position:static;margin-bottom:20px}}
.box{background:#fffdf7;border:1px solid var(--linha);border-radius:4px;padding:20px 22px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.aviso{border:2px solid var(--vermelho);background:#fff6f3;padding:16px 18px;border-radius:4px;font-family:var(--sans);font-size:15.5px;line-height:1.5}
.aviso b{color:var(--vermelho)}
.selo{display:inline-block;font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#fff;background:var(--vermelho);padding:3px 9px;border-radius:3px}
label.l{display:block;font-family:var(--sans);font-weight:600;font-size:14px;margin:14px 0 6px}
input.campo{width:100%;padding:12px 14px;border:2px solid var(--tinta);border-radius:4px;background:#fff;font-family:var(--sans);font-size:17px}
input.campo:focus,textarea:focus{outline:3px solid var(--ouro);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:800;font-size:16px;border:2px solid var(--tinta);background:var(--tinta);color:#f6f1e7;padding:11px 20px;border-radius:4px;cursor:pointer;transition:transform .08s,box-shadow .15s;box-shadow:3px 3px 0 var(--ouro)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ouro)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.btn.sec{background:transparent;color:var(--tinta);box-shadow:3px 3px 0 var(--linha)}
.btn.verm{background:var(--vermelho);border-color:var(--vermelho);box-shadow:3px 3px 0 var(--tinta)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.acoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.erro{color:var(--vermelho);font-family:var(--sans);font-size:14px;margin-top:6px;min-height:18px}
.mini{font-family:var(--sans);font-size:13px;color:var(--cinza)}
ul.lista{padding-left:20px;margin:8px 0}
ul.lista li{margin:4px 0}
h2.secao{font-family:var(--titulo);font-weight:900;font-size:30px;margin:28px 0 4px;border-top:3px solid var(--tinta);padding-top:10px}
/* redação */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:14px}
.mesa{position:relative;background:#fffdf7;border:1px solid var(--linha);border-top:7px solid var(--c);border-radius:4px;padding:16px 16px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;width:100%}
.mesa:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.09)}
.mesa .num{font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:2px;color:var(--c);text-transform:uppercase}
.mesa .nome{font-family:var(--titulo);font-weight:900;font-size:22px;line-height:1.1;margin:4px 0 8px}
.mesa .simb{position:absolute;right:14px;top:10px;font-size:30px;color:var(--c);opacity:.85}
.mesa .st{font-family:var(--sans);font-size:13px;color:var(--cinza)}
.mesa .carimbo{position:absolute;right:10px;bottom:10px;transform:rotate(-12deg);border:3px solid var(--verde);color:var(--verde);font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:2px;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.7)}
.mesa.especial{border-top-color:var(--tinta);background:var(--tinta);color:#f6f1e7}
.mesa.especial .num,.mesa.especial .simb{color:var(--ouro)}
.mesa.especial .st{color:#cfc6b3}
.mesa.trancada{cursor:not-allowed;opacity:.75}
.mesa.trancada:hover{transform:none;box-shadow:none}
.progresso{height:10px;background:var(--papel2);border-radius:9px;overflow:hidden;border:1px solid var(--linha)}
.progresso i{display:block;height:100%;background:var(--verde);transition:width .5s}
/* pauta */
.pauta{border-left:8px solid var(--c);padding-left:20px}
.pauta .frase{font-family:var(--titulo);font-size:clamp(22px,3.2vw,30px);font-weight:700;line-height:1.2;margin:8px 0 16px}
.ficha{display:grid;grid-template-columns:160px 1fr;gap:6px 16px;font-size:17px}
.ficha dt{font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c);padding-top:4px}
.ficha dd{margin:0 0 6px}
@media (max-width:640px){.ficha{grid-template-columns:1fr}.ficha dt{padding-top:8px}}
.arquivo{margin-top:18px;background:var(--papel2);border:1px dashed #b9ad94;padding:14px 18px;border-radius:4px}
.arquivo q{font-style:italic;font-size:20px}
.arquivo .ref{font-family:var(--sans);font-size:13px;color:var(--cinza);margin-top:6px}
/* pergunta */
.topo-rodada{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.pontos{display:flex;gap:6px}
.pontos span{width:14px;height:14px;border-radius:50%;background:var(--papel2);border:2px solid var(--linha)}
.pontos span.ok{background:var(--verde);border-color:var(--verde)}
.pontos span.no{background:var(--vermelho);border-color:var(--vermelho)}
.pontos span.at{border-color:var(--tinta);transform:scale(1.2)}
.cartao{background:#fffdf7;border:1px solid var(--linha);border-radius:4px;padding:22px 24px;box-shadow:0 6px 0 -2px var(--papel2),0 6px 0 -1px var(--linha);animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tipo{font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--c,var(--vermelho))}
.enun{font-size:21px;line-height:1.45;margin:8px 0 16px}
.recorte{background:#fbf7ee;border:1px solid var(--linha);border-left:5px solid var(--tinta);padding:14px 16px;margin:10px 0 16px;font-size:18px;position:relative}
.recorte .fonte{display:block;font-family:var(--sans);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);margin-bottom:6px;font-weight:600}
.recorte .fonte.real{color:var(--vermelho)}
.ops{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--linha);border-radius:6px;padding:12px 14px;cursor:pointer;font-size:17.5px;line-height:1.4;transition:border-color .12s,background .12s}
.op:hover:not([disabled]){border-color:var(--tinta)}
.op .letra{font-family:var(--sans);font-weight:800;min-width:26px;height:26px;border-radius:50%;background:var(--papel2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.op.certa{border-color:var(--verde);background:#eef8f1}
.op.certa .letra{background:var(--verde);color:#fff}
.op.errada{border-color:var(--vermelho);background:#fdf0ee}
.op.errada .letra{background:var(--vermelho);color:#fff}
.op[disabled]{cursor:default}
.feedback{margin-top:16px;padding:14px 16px;border-radius:4px;font-size:17px;animation:entra .3s ease}
.feedback.ok{background:#eef8f1;border-left:5px solid var(--verde)}
.feedback.no{background:#fdf0ee;border-left:5px solid var(--vermelho)}
.feedback b.v{font-family:var(--sans);display:block;margin-bottom:4px}
textarea{width:100%;min-height:220px;border:2px solid var(--tinta);border-radius:4px;padding:14px;font-family:var(--serif);font-size:18px;line-height:1.5;background:#fff;resize:vertical}
.contador{font-family:var(--sans);font-size:13px;color:var(--cinza);margin-top:6px}
.contador.ok{color:var(--verde)}
.checklist label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:17px;cursor:pointer}
.checklist input{margin-top:6px;transform:scale(1.25)}
.regua{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.regua div{background:var(--papel2);border-radius:4px;padding:10px 12px;font-family:var(--sans);font-size:14px}
.regua b{display:block;font-size:13px;letter-spacing:1px;text-transform:uppercase}
@media (max-width:640px){.regua{grid-template-columns:1fr}}
/* fim de rodada */
.placar{text-align:center;padding:30px 10px}
.placar .grande{font-family:var(--titulo);font-weight:900;font-size:64px;line-height:1}
.carimbao{display:inline-block;margin:16px auto;border:5px solid var(--verde);color:var(--verde);font-family:var(--sans);font-weight:800;font-size:28px;letter-spacing:6px;padding:6px 18px;border-radius:6px;transform:rotate(-8deg);animation:carimbo .5s cubic-bezier(.2,1.6,.4,1)}
.carimbao.verm{border-color:var(--vermelho);color:var(--vermelho)}
@keyframes carimbo{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.cracha{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--c);color:var(--c);border-radius:999px;padding:2px 10px;font-family:var(--sans);font-weight:800;font-size:12px;margin:3px;background:#fff}
.cracha.off{border-color:var(--linha);color:#b6ad9b}
/* respostas */
.resp{border-top:1px solid var(--linha);padding:14px 0}
.resp .meta{font-family:var(--sans);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza)}
.resp .q{font-weight:600;margin:4px 0}
.resp .t{white-space:pre-wrap;background:#fff;border:1px solid var(--linha);padding:10px 12px;border-radius:4px;font-size:16.5px}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:3px;background:var(--papel2);margin-left:6px}
.tag.ok{background:#e1f2e7;color:var(--verde)}
#toast{opacity:0;visibility:hidden;position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--tinta);color:#f6f1e7;font-family:var(--sans);font-size:15px;padding:12px 18px;border-radius:6px;transition:transform .3s;z-index:50;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.xpfloat{position:fixed;font-family:var(--sans);font-weight:800;color:var(--ouro);font-size:22px;pointer-events:none;animation:sobe 1.1s ease forwards;z-index:60;text-shadow:0 1px 0 #000}
@keyframes sobe{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rodape{margin-top:40px;border-top:1px solid var(--tinta);padding-top:10px;font-family:var(--sans);font-size:12.5px;color:var(--cinza)}
</style>
</head>
<body>
<div id="barra" hidden></div>
<main class="wrap" id="app"><p class="sans" style="padding:40px 0">Carregando a redação…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js?v=2026-11-14c"></script>
<script src="dados.js?v=2026-11-14c"></script>
<script src="jogo.js?v=2026-11-14c"></script>
</body>
</html>
